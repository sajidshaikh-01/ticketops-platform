apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sajidshaikh-01/ticketops-platform.git
    targetRevision: develop
    path: helm/ticketops-service
    helm:
      valueFiles:
        - values/dev/shared.yaml
        - values/dev/dashboard.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ticketops-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false