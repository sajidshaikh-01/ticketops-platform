apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tracing-dev
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: tempo
      targetRevision: "2.2.3"
      helm:
        valueFiles:
          - $values/monitoring/values/dev/tempo-values.yaml
    - repoURL: https://github.com/sajidshaikh-01/ticketops-platform.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true