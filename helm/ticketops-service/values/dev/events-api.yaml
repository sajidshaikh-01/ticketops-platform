replicaCount: 2
image:
  repository: 674182809289.dkr.ecr.us-east-1.amazonaws.com/ticketops-dev-events-api
  tag: "otel-tracing-v1"
service:
  port: 80
  targetPort: 3000
envFromSecret: ticketops-db-secret
env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3000"
  - name: CORS_ORIGIN
    value: "https://dev.sajid-platform.online"
ingress:
  enabled: true
  path: /api
  groupName: ticketops-dev
  groupOrder: 10
healthCheck:
  enabled: true
  path: /api/health
  port: 3000
