replicaCount: 2 # initial value only; ignored once autoscaling.enabled is true

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

image:
  repository: 674182809289.dkr.ecr.us-east-1.amazonaws.com/ticketops-dev-events-api
  tag: "4831ca6"
service:
  port: 80
  targetPort: 3000
envFromSecret: ticketops-db-secret
env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3000"
  - name: CORS_ORIGIN
    value: "https://dev.sajid-platform.online"
ingress:
  enabled: true
  path: /api
  groupName: ticketops-dev
  groupOrder: 10
healthCheck:
  enabled: true
  path: /api/health
  port: 3000
