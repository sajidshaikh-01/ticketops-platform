replicaCount: 2 # initial value only; ignored once autoscaling.enabled is true
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
image:
  repository: 674182809289.dkr.ecr.us-east-1.amazonaws.com/ticketops-dev-dashboard
  tag: "b2290a0"
service:
  port: 80
  targetPort: 8080
env:
  - name: EVENTS_API_URL
    value: "/api"
  - name: ADMIN_API_URL
    value: "/api/admin"
ingress:
  enabled: true
  path: /
  groupName: ticketops-dev
  groupOrder: 100
healthCheck:
  enabled: true
  path: /health
  port: 8080
