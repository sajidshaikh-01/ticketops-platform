apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-events-api-observability
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  events-api-observability.json: |-
    {
      "id": null,
      "uid": "events-api-observability",
      "title": "TicketOps - events-api Observability",
      "tags": ["ticketops", "events-api"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate by Route",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_requests_total{job=\"events-api-dev\"}[5m])) by (route)",
              "legendFormat": "{{route}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            },
            "overrides": []
          }
        }
      ]
    }
