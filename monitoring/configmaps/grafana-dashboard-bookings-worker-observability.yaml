apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-bookings-worker-observability
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  bookings-worker-observability.json: |-
    {
      "id": null,
      "uid": "bookings-worker-observability",
      "title": "TicketOps - bookings-worker Observability",
      "tags": ["ticketops", "bookings-worker"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Job Processing Rate (Success vs Failed)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(booking_jobs_processed_total{job=\"bookings-worker-dev\"}[5m])) by (status)",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 },
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Active Jobs",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "booking_jobs_active{job=\"bookings-worker-dev\"}",
              "legendFormat": "active jobs",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "P50 / P95 / P99 Processing Duration",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.50, sum(rate(booking_job_processing_duration_seconds_bucket{job=\"bookings-worker-dev\"}[5m])) by (le))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(booking_job_processing_duration_seconds_bucket{job=\"bookings-worker-dev\"}[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.99, sum(rate(booking_job_processing_duration_seconds_bucket{job=\"bookings-worker-dev\"}[5m])) by (le))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 5, "lineWidth": 2 }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Total Jobs Processed (Last 1h)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(increase(booking_jobs_processed_total{job=\"bookings-worker-dev\"}[1h]))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "none" },
            "overrides": []
          }
        },
        {
          "id": 5,
          "title": "Failure Rate % (Last 5m)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "100 * sum(rate(booking_jobs_processed_total{job=\"bookings-worker-dev\", status=\"failed\"}[5m])) / clamp_min(sum(rate(booking_jobs_processed_total{job=\"bookings-worker-dev\"}[5m])), 1)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "title": "Permanently Failed Jobs (Total)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 12, "x": 12, "y": 12 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "booking_jobs_failed_permanently_total{job=\"bookings-worker-dev\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        }
      ]
    }
